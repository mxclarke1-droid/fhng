```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santa Tracker Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#status {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    color: white;
    background: black;
    padding: 15px;
    font-family: Arial, sans-serif;
    font-size: 18px;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>

<body>

<div id="status">
    LOADING...
</div>

<script>

/* ==========================================
   SCENE
========================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* ==========================================
   CAMERA
========================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.z = 7;


/* ==========================================
   RENDERER
========================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

document.body.appendChild(
    renderer.domElement
);


/* ==========================================
   LIGHT
========================================== */

const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    5,
    5,
    5
);

scene.add(light);


const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1
    );

scene.add(ambient);


/* ==========================================
   EARTH
========================================== */

const earth =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            2,
            64,
            64
        ),

        new THREE.MeshPhongMaterial({
            color: 0x1687ff
        })

    );

scene.add(earth);


/* ==========================================
   RED SANTA TEST
========================================== */

const santaTest =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.7,
            0.7,
            0.7
        ),

        new THREE.MeshPhongMaterial({
            color: 0xff0000
        })

    );


/*
   IMPORTANT:

   Santa test is placed at the
   CENTER of the scene.

   We are doing this ONLY to
   make sure the object renders.
*/

santaTest.position.set(
    0,
    0,
    0
);

scene.add(
    santaTest
);


/* ==========================================
   STATUS
========================================== */

document.getElementById(
    "status"
).innerHTML =
    "🌎 EARTH WORKING<br>🔴 SANTA TEST AT CENTER";


/* ==========================================
   ANIMATION
========================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    earth.rotation.y += 0.002;

    santaTest.rotation.y += 0.01;


    renderer.render(
        scene,
        camera
    );

}

animate();


/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
