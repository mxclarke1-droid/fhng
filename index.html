```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Santa Tracker Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#status {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    color: white;
    background: black;
    padding: 15px;
    font-family: Arial, sans-serif;
    font-size: 18px;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>

<body>

<div id="status">
    TEST
</div>

<script>

/* SCENE */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* CAMERA */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.z = 7;


/* RENDERER */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);


/* LIGHT */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);


/* EARTH */

const earth =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            2,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({
            color: 0x1687ff
        })

    );

scene.add(earth);


/* RED CUBE */

const cube =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1,
            1,
            1
        ),

        new THREE.MeshBasicMaterial({
            color: 0xff0000
        })

    );


/*
   Camera is at Z = 7.

   Earth extends from roughly
   Z = -2 to Z = +2.

   Put the cube at Z = 4.

   Therefore it is definitely
   in front of Earth.
*/

cube.position.set(
    0,
    0,
    4
);

scene.add(cube);


/* STATUS */

document.getElementById(
    "status"
).innerHTML =
    "🌎 BLUE EARTH<br>🔴 RED CUBE IN FRONT";


/* ANIMATION */

function animate() {

    requestAnimationFrame(
        animate
    );

    earth.rotation.y += 0.002;

    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;

    renderer.render(
        scene,
        camera
    );
}

animate();


/* RESIZE */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
